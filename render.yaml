# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Free instance type, deliberately: Render gates *any* paid resource (a larger
# plan, or a disk) behind a card on file, and account credit does not waive
# that. Free instances cannot mount a disk, so persistence comes from the
# app's own encrypted backup layer instead — see FREEAPI_DB_BACKUP_URL below.
services:
  - type: web
    name: freellmapi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/ping
    envVars:
      # 64-char hex. Also doubles as the backup encryption key, so losing it
      # means losing every provider key already stored.
      - key: ENCRYPTION_KEY
        sync: false
      # Where the encrypted SQLite snapshot lives. A free instance has an
      # ephemeral filesystem: without this, every spin-down loses the provider
      # keys. db-backup.ts restores from here on boot when the DB is missing,
      # then re-uploads every 5 minutes.
      # Format (parseHuggingFaceTarget, db-backup.ts:95):
      #   https://huggingface.co/datasets/<user>/<repo>/resolve/main/freellmapi.db.enc
      - key: FREEAPI_DB_BACKUP_URL
        sync: false
      # HF write token. Uploads 401 without it, and the failure only ever
      # surfaces later as an empty restore.
      - key: FREEAPI_DB_BACKUP_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
